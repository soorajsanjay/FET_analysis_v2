[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fet-analyzer"
version = "2.0.0"
description = "FET electrical-characterization analysis pipeline and dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Sooraj Sanjay", email = "sooraj.sanjay@gmail.com"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]
native = ["pywebview>=6.0,<7"]
test = ["coverage>=7.6,<8"]

[project.scripts]
fet-analyzer = "fet_analyzer.cli:main"
fet-dashboard = "fet_analyzer.dashboard.server:main"
fet-native = "fet_analyzer.native:main"

[tool.setuptools.packages.find]
include = ["fet_analyzer*"]

[tool.setuptools.package-data]
"fet_analyzer.dashboard" = ["static/*"]
